set -g prefix C-a
unbind C-b
bind C-a send-prefix
bind -N 'Projects and sessions' f display-popup -E -d '#{pane_current_path}' -w 90% -h 80% -s 'bg=#1a1b26,fg=#c0caf5' -S 'fg=#7dcfff' -T ' ◆ Projects ' "$HOME/.local/bin/tmux-projects"

set -g mouse on

# Preserve application scrolling; otherwise enter tmux scrollback.
bind -n WheelUpPane if-shell -F -t = \
    '#{||:#{pane_in_mode},#{||:#{alternate_on},#{mouse_any_flag}}}' \
    'send-keys -M' \
    'copy-mode -e -t =; send-keys -N 1 -X -t = scroll-up'

bind -n WheelDownPane send-keys -M

# One line per wheel event, for both copy-mode key layouts.
bind -T copy-mode    WheelUpPane   send-keys -N 1 -X -t = scroll-up
bind -T copy-mode    WheelDownPane send-keys -N 1 -X -t = scroll-down

bind -T copy-mode-vi WheelUpPane   send-keys -N 1 -X -t = scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -N 1 -X -t = scroll-down
set -g extended-keys-format csi-u

# Tokyo Night: session on the left, window tabs centered on one bottom row.
set -g base-index 1
set -g renumber-windows on
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style 'bg=#1a1b26,fg=#a9b1d6'
set -g status-left ' #[fg=#7dcfff]◆ #[fg=#c0caf5,bold]#{=20:session_name} '
set -g status-right '#[fg=#9ece6a]%H:%M '
set -g status-format[0] '#[align=left]#{T:status-left}#[list=on align=absolute-centre]#[list=left-marker]‹#[list=right-marker]›#[list=on]#{W:#[range=window|#{window_index}]#[fg=#7a83a6]  #{window_index}:#{=12:window_name}  #[norange list=on],#[range=window|#{window_index} list=focus]#[fg=#1a1b26]#[bg=#7aa2f7]#[bold]  #{window_index}:#{=12:window_name}  #[default]#[norange list=on]}#[nolist align=right]#{T:status-right}'

set -g message-style 'bg=#7dcfff,fg=#1a1b26'
set -g mode-style 'bg=#7aa2f7,fg=#1a1b26'
set -g pane-border-style 'fg=#414868'
set -g pane-active-border-style 'fg=#7dcfff'
set -g focus-events on

# Vim-style copy mode: prefix [ to enter, v/V/C-v to select, y to copy to macOS clipboard.
setw -g mode-keys vi
set -g history-limit 50000
set -s escape-time 10
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle \; send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi Escape send -X cancel

# prefix D: open ~/note.md in nvim from anywhere (popup)
bind -N 'Scratchpad' D display-popup -E -d "$HOME" -w 90% -h 85% -s 'bg=#1a1b26,fg=#c0caf5' -S 'fg=#7dcfff' -T ' ◆ Scratchpad ' "nvim $HOME/note.md"
